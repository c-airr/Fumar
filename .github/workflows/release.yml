name: release

# Builds fumar for the three targets and attaches the results to a GitHub
# release.
#
# Two ways in. Pushing a tag that starts with v does the whole thing including
# publishing; running it by hand from the Actions tab builds everything and
# leaves the packages as downloadable artifacts without publishing anything,
# which is what you want when checking that the build itself still works.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only one release run at a time. Two overlapping runs would race to create the
# same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  #  Windows x64
  # ---------------------------------------------------------------------------
  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Sets INCLUDE, LIB and PATH for the MSVC toolchain. CMake with Ninja does
      # not run vcvars itself, and without it the linker cannot find libcmt or
      # kernel32 - the same reason tools/dev.ps1 exists for local builds.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $version = (Invoke-RestMethod "https://vulkan.lunarg.com/sdk/latest/windows.json").windows
          Write-Host "Vulkan SDK $version"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          Invoke-WebRequest $url -OutFile vulkan_sdk.exe
          # The SDK ships a Qt installer. These four arguments are what turn it
          # from a wizard into a silent install.
          Start-Process -Wait vulkan_sdk.exe -ArgumentList `
            "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install"
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Both Windows jobs install it explicitly rather than relying on the
      # runner image: Ninja is present on those images, but whether it is on
      # PATH has changed between image versions, and a build that breaks when
      # GitHub updates an image is not worth the thirty seconds saved.
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release

      - name: Package
        shell: pwsh
        run: |
          cmake --install build/windows-release --prefix dist
          Compress-Archive -Path dist/* -DestinationPath fumar-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: fumar-windows-x64
          path: fumar-windows-x64.zip

  # ---------------------------------------------------------------------------
  #  Windows ARM64
  # ---------------------------------------------------------------------------
  #  On a native ARM64 runner rather than cross-compiled from x64, and that is
  #  not a preference. LuaJIT builds two tools of its own during its build -
  #  minilua and buildvm - and then RUNS them to generate the rest. Cross
  #  compiling produces ARM64 copies of those tools on an x64 host, where they
  #  cannot run. Building on the target architecture sidesteps the whole
  #  problem.
  windows-arm64:
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      # The x64 SDK, on an ARM64 machine, on purpose. Only two things are needed
      # from it: the headers, which have no architecture, and glslc, which is a
      # build tool and runs perfectly well under the x64 emulation Windows on
      # ARM provides. The one part that would be wrong - vulkan-1.lib - is never
      # linked: fumar resolves every Vulkan entry point at runtime through the
      # loader SDL hands it.
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $version = (Invoke-RestMethod "https://vulkan.lunarg.com/sdk/latest/windows.json").windows
          Write-Host "Vulkan SDK $version (x64 build, for the headers and glslc)"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          Invoke-WebRequest $url -OutFile vulkan_sdk.exe
          Start-Process -Wait vulkan_sdk.exe -ArgumentList `
            "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install"
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Configure
        run: cmake --preset windows-arm64-release

      - name: Build
        run: cmake --build --preset windows-arm64-release

      - name: Package
        shell: pwsh
        run: |
          cmake --install build/windows-arm64-release --prefix dist
          Compress-Archive -Path dist/* -DestinationPath fumar-windows-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: fumar-windows-arm64
          path: fumar-windows-arm64.zip

  # ---------------------------------------------------------------------------
  #  Linux x64
  # ---------------------------------------------------------------------------
  #  Pinned to 24.04, and the version is a real decision rather than "whatever
  #  is newest". The glibc a binary is built against is the OLDEST it will run
  #  on, so the instinct is to build on the oldest runner available - 22.04,
  #  which would reach back further.
  #
  #  That does not work here: glslc is not a package on 22.04 (Ubuntu started
  #  shipping it at 23.04), and the alternatives are adding LunarG's apt
  #  repository or fetching a shaderc build by hand, both of which trade a
  #  known-good build for a fragile one. 24.04 is also exactly what
  #  tools/linux-build.sh is tested against locally, so CI and the local
  #  container agree.
  #
  #  The cost, stated plainly: the Linux package needs glibc 2.39, so Ubuntu
  #  24.04 or newer, Debian 13, Fedora 40.
  linux-x64:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # The same package list as tools/linux-build.sh, which is what proves
      # this list is right - it is used locally too, not only here.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang cmake ninja-build make gcc pkg-config \
            libvulkan-dev glslc \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release

      - name: Package
        run: |
          cmake --install build/linux-release --prefix dist
          tar -czf fumar-linux-x64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: fumar-linux-x64
          path: fumar-linux-x64.tar.gz

  # ---------------------------------------------------------------------------
  #  Publish
  # ---------------------------------------------------------------------------
  #  Only on a tag. A manual run stops after the three builds and leaves the
  #  packages as artifacts, which is what you want when you are checking whether
  #  the build still works rather than shipping.
  release:
    needs: [windows-x64, windows-arm64, linux-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
